services:
  nginx:
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN to the public hostname}
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports: !override
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    volumes: !override
      - ./:/var/www/html:ro
      - ./docker/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/security-headers.inc:/etc/nginx/conf.d/security-headers.inc:ro
      - type: bind
        source: ${TLS_CERT_DIR:?Set TLS_CERT_DIR to a directory containing fullchain.pem and privkey.pem}
        target: /etc/nginx/tls
        read_only: true
